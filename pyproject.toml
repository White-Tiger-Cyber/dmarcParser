
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmarcparser"
version = "0.1.1"
description = "DMARC aggregate (RUA) report parser and REPL for threat-hunting"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "rich>=13.7.1",
    "tabulate>=0.9.0",
    "google-api-python-client>=2.0",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.0",
    "anthropic>=0.40",
    "flask>=3.0",
    "python-dotenv>=1.0"
]

[project.scripts]
dP = "dmarcparser.cli:main"

[tool.setuptools.packages.find]
include = ["dmarcparser*"]
exclude = ["demo*", "tests*", "samples*", "scripts*"]
